[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "payment-service"
version = "0.1.0"
description = "Asynchronous payment processing with a transactional outbox"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aio-pika>=9.6,<10",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "faststream[rabbit]>=0.6,<0.7",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "typing-extensions>=4.12,<5",
    "uvicorn>=0.32,<1",
]

[tool.poetry]
packages = [{ include = "payment_service", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
pytest-asyncio = ">=0.25,<2"
ruff = ">=0.9,<1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires TEST_DATABASE_URL pointing to PostgreSQL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

